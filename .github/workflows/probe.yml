name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q yt-dlp imageio-ffmpeg
      - name: Try each YouTube client
        shell: python
        run: |
          import subprocess, imageio_ffmpeg
          from yt_dlp import YoutubeDL
          url = "https://www.youtube.com/watch?v=3H4IVQejlDE"
          for client in ["default", "tv", "tv_simply", "tv_embedded", "web_safari", "mweb", "ios", "android_vr", "web_embedded", "web_creator", "android"]:
              opts = {"quiet": True, "no_warnings": True, "js_runtimes": {"deno": {}, "node": {}},
                      "format": "bestvideo[height<=1080][protocol^=m3u8]/best[protocol^=m3u8]"}
              if client != "default":
                  opts["extractor_args"] = {"youtube": {"player_client": [client]}}
              try:
                  with YoutubeDL(opts) as y:
                      info = y.extract_info(url, download=False)
                  r = subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), "-hide_banner", "-loglevel", "error",
                                      "-live_start_index", "-1", "-i", info["url"], "-frames:v", "1", "-y", f"{client}.png"],
                                     capture_output=True, text=True, timeout=60)
                  print(f"PROBE {client}: OK formats, {info.get('height')}p, ffmpeg rc={r.returncode} {r.stderr[:200]}")
              except Exception as e:
                  print(f"PROBE {client}: FAIL {str(e)[:160]}")
